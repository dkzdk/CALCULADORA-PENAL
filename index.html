<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ATLAS MDT POLICIAL</title>

<style>
body{margin:0;font-family:Arial;background:#020611;color:#00d4ff;}

#loginBox{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#000;}

.login-card{background:#0a0f18;padding:20px;border-radius:10px;width:320px;}

input,select,textarea{width:100%;padding:10px;margin:5px 0;background:#050a14;border:1px solid #1a2a3a;color:#fff;border-radius:6px;}

button{width:100%;padding:8px;background:#00d4ff;border:none;cursor:pointer;border-radius:6px;font-weight:bold;margin-top:5px;}

#app{display:none;}

.topbar{background:#000;padding:10px;display:flex;justify-content:space-between;}

.tabs{display:flex;background:#0a0f18;}
.tabs button{flex:1;padding:10px;border:none;background:#050a14;color:#00d4ff;cursor:pointer;}
.tabs button.active{background:#00d4ff;color:#000;}

.tab{display:none;padding:10px;}
.tab.active{display:block;}

.card{background:#0a0f18;padding:10px;border-radius:10px;margin-bottom:10px;}

.crime{display:flex;justify-content:space-between;padding:5px;background:#000;margin-top:5px;border-radius:6px;}

.hidden{display:none;}
</style>
</head>

<body>

<div id="loginBox">
<div class="login-card">
<h3>🔐 ATLAS MDT POLICIAL</h3>

<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<select id="role">
<option value="pm">Policial Militar</option>
<option value="pc">Policial Civil</option>
<option value="juridico">Jurídico</option>
</select>

<button onclick="register()">Cadastrar</button>
<button onclick="login()">Entrar</button>
</div>
</div>

<div id="app">

<div class="topbar">
<span>ATLAS MDT POLICIAL</span>
<button onclick="logout()">Sair</button>
</div>

<div class="tabs">
<button class="active" onclick="tab(0)">Código Penal</button>
<button onclick="tab(1)">Consulta</button>
<button onclick="tab(2)">BO</button>
<button id="adminTabBtn" class="hidden" onclick="tab(3)">Admin</button>
</div>

<div class="tab active">
<div class="card">
<h3>📚 Código Penal Completo</h3>
<select id="crime">
<option value="homicidio_culposo">Art.123 Homicídio Culposo</option>
<option value="omissao">Art.124 Omissão de Socorro</option>
<option value="sequestro">Art.159 Sequestro</option>
<option value="dano">Art.160 Dano ao Patrimônio</option>
<option value="receptacao">Art.161 Receptação</option>
<option value="dui">Art.162 DUI</option>
<option value="atropelamento">Art.163 Atropelamento</option>
<option value="desacato">Art.164 Desacato</option>
<option value="resistencia">Art.165 Resistência à Prisão</option>
<option value="obstrucao">Art.166 Obstrução de Justiça</option>
<option value="porte">Art.167 Porte Ilegal de Arma</option>
<option value="disparo">Art.168 Disparo em Via Pública</option>
<option value="fraude">Art.169 Fraude Bancária</option>
<option value="invasao">Art.170 Invasão de Sistema</option>
<option value="identidade">Art.171 Falsa Identidade</option>
<option value="calunia">Art.172 Denunciação Caluniosa</option>

<!-- NOVOS ARTIGOS -->
<option value="corrupcao">Art.173 Corrupção Ativa</option>
<option value="lavagem">Art.174 Lavagem de Dinheiro</option>
<option value="organizacao">Art.175 Organização Criminosa</option>
<option value="trafico_armas">Art.176 Tráfico de Armas</option>
<option value="evasao">Art.177 Evasão de Prisão</option>
<option value="assalto_banco">Art.178 Assalto a Banco</option>
<option value="sequestro_relampago">Art.179 Sequestro Relâmpago</option>
<option value="homicidio_qualificado">Art.180 Homicídio Qualificado</option>
<option value="cyberstalking">Art.181 Cyberstalking</option>
<option value="extorsao_qualificada">Art.182 Extorsão Qualificada</option>
</select>
<button onclick="addCrime()">Adicionar</button>
<div id="list"></div>
</div>

<div class="card">
Tempo: <span id="tempo">0</span> meses<br>
Multa: $<span id="multa">0</span>
</div>
</div>

<div class="tab">
<div class="card">
<h3>🔎 Consulta</h3>
<input placeholder="Nome / CPF / Placa">
<button>Buscar</button>
</div>
</div>

<div class="tab">
<div class="card">
<h3>📄 BO</h3>
<textarea id="bo" rows="10"></textarea>
<button onclick="saveBO()">Salvar BO</button>
<button onclick="sendWebhook()">Enviar Discord</button>
</div>
</div>

<div class="tab">
<div class="card">
<h3>⚙️ Admin (Restrito)</h3>
<button onclick="clearAll()">Reset Sistema</button>
</div>
</div>

</div>

<script>

const OWNER="Nicolas";
const webhookURL="https://discordapp.com/api/webhooks/1501244387185790986/6DLO24Eu_c-MZVNBJ7ZmcVX2RCw4SQA-3udA5UjV5gTp28jCH6YBO_SupKqVOKmqc9V0";

function register(){localStorage.setItem(user.value,JSON.stringify({pass:pass.value,role:role.value}));alert("Conta criada");}

function login(){let d=localStorage.getItem(user.value);if(!d)return alert("Usuário não existe");d=JSON.parse(d);if(d.pass!==pass.value)return alert("Senha incorreta");localStorage.setItem("logado",user.value);localStorage.setItem("role",d.role);start();}

function start(){document.getElementById("loginBox").style.display="none";document.getElementById("app").style.display="block";if(localStorage.getItem("logado")===OWNER){document.getElementById("adminTabBtn").classList.remove("hidden");}}

if(localStorage.getItem("logado"))start();

function logout(){localStorage.clear();location.reload();}

function tab(i){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".tab")[i].classList.add("active");document.querySelectorAll(".tabs button")[i].classList.add("active");}

const dbCP={
homicidio_culposo:{t:35,m:90000},
omissao:{t:25,m:50000},
sequestro:{t:80,m:250000},
dano:{t:20,m:40000},
receptacao:{t:35,m:80000},
dui:{t:25,m:60000},
atropelamento:{t:40,m:100000},
desacato:{t:15,m:30000},
resistencia:{t:30,m:60000},
obstrucao:{t:50,m:120000},
porte:{t:40,m:120000},
disparo:{t:55,m:150000},
fraude:{t:50,m:120000},
invasao:{t:60,m:150000},
identidade:{t:35,m:80000},
calunia:{t:45,m:100000},

corrupcao:{t:60,m:200000},
lavagem:{t:70,m:300000},
organizacao:{t:80,m:400000},
trafico_armas:{t:70,m:250000},
evasao:{t:50,m:150000},
assalto_banco:{t:90,m:500000},
sequestro_relampago:{t:60,m:250000},
homicidio_qualificado:{t:80,m:300000},
cyberstalking:{t:30,m:100000},
extorsao_qualificada:{t:70,m:250000}
};

let crimes=[];

function addCrime(){crimes.push(crime.value);render();}
function render(){list.innerHTML="";let t=0,m=0;crimes.forEach((c,i)=>{t+=dbCP[c].t;m+=dbCP[c].m;list.innerHTML+=`<div class='crime'>${c}<button onclick='remove(${i})'>X</button></div>`;});tempo.innerText=t;multa.innerText=m;}
function remove(i){crimes.splice(i,1);render();}
function saveBO(){localStorage.setItem("bo",bo.value);alert("BO salvo");}
bo.value=localStorage.getItem("bo")||"";
function sendWebhook(){fetch(webhookURL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:`📄 BO ${localStorage.getItem("logado")}\n${bo.value||"vazio"}`})});alert("Enviado");}
function clearAll(){if(localStorage.getItem("logado")!==OWNER){alert("Sem permissão");return;}localStorage.clear();location.reload();}

</script>

</body>
</html>
