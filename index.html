<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ATLAS MDT POLICIAL</title>

<style>
body{
margin:0;
font-family:Arial;
background:#020611;
color:#00d4ff;
}

#loginBox{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#000;
}

.login-card{
background:#0a0f18;
padding:20px;
border-radius:10px;
width:320px;
}

input,select,textarea{
width:100%;
padding:10px;
margin:5px 0;
background:#050a14;
border:1px solid #1a2a3a;
color:#fff;
border-radius:6px;
}

button{
width:100%;
padding:8px;
background:#00d4ff;
border:none;
cursor:pointer;
border-radius:6px;
font-weight:bold;
margin-top:5px;
}

#app{display:none;}

.topbar{
background:#000;
padding:10px;
display:flex;
justify-content:space-between;
}

.tabs{
display:flex;
background:#0a0f18;
}

.tabs button{
flex:1;
padding:10px;
border:none;
background:#050a14;
color:#00d4ff;
cursor:pointer;
}

.tabs button.active{
background:#00d4ff;
color:#000;
}

.tab{display:none;padding:10px;}
.tab.active{display:block;}

.card{
background:#0a0f18;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.crime{
display:flex;
justify-content:space-between;
padding:5px;
background:#000;
margin-top:5px;
border-radius:6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<div class="login-card">
<h3>🔐 ATLAS MDT PRO MAX</h3>

<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="topbar">
<span>MDT POLICIAL - ATLAS RP</span>
<button onclick="logout()">Sair</button>
</div>

<div class="tabs">
<button class="active" onclick="tab(0)">BO</button>
<button onclick="tab(1)">Ficha</button>
</div>

<!-- BO -->
<div class="tab active">

<div class="card">
<h3>📄 BO COMPLETO</h3>

<input id="oficialNome" placeholder="Nome do Oficial">
<input id="oficialId" placeholder="ID do Oficial">

<input id="suspeitoNome" placeholder="Nome do Suspeito">
<input id="suspeitoId" placeholder="ID do Suspeito">

<textarea id="bo" rows="5" placeholder="Descrição do Ocorrido"></textarea>

<select id="crime">

<optgroup label="🚨 Vida">
<option value="homicidio_culposo">Art.123 Homicídio Culposo</option>
<option value="omissao">Art.124 Omissão de Socorro</option>
<option value="homicidio_qualificado">Art.180 Homicídio Qualificado</option>
</optgroup>

<optgroup label="💰 Patrimônio">
<option value="sequestro">Art.159 Sequestro</option>
<option value="dano">Art.160 Dano</option>
<option value="receptacao">Art.161 Receptação</option>
<option value="assalto_banco">Art.178 Assalto a Banco</option>
<option value="sequestro_relampago">Art.179 Sequestro Relâmpago</option>
</optgroup>

<optgroup label="🚗 Trânsito">
<option value="dui">Art.162 DUI</option>
<option value="atropelamento">Art.163 Atropelamento</option>
</optgroup>

<optgroup label="🚔 Autoridade">
<option value="desacato">Art.164 Desacato</option>
<option value="resistencia">Art.165 Resistência</option>
<option value="obstrucao">Art.166 Obstrução</option>
</optgroup>

<optgroup label="🔫 Armas">
<option value="porte">Art.167 Porte Ilegal</option>
<option value="disparo">Art.168 Disparo</option>
<option value="trafico_armas">Art.176 Tráfico de Armas</option>
</optgroup>

<optgroup label="💻 Digitais">
<option value="fraude">Art.169 Fraude Bancária</option>
<option value="invasao">Art.170 Invasão Sistema</option>
<option value="cyberstalking">Art.181 Cyberstalking</option>
</optgroup>

<optgroup label="🧠 Gerais">
<option value="identidade">Art.171 Falsa Identidade</option>
<option value="calunia">Art.172 Calúnia</option>
<option value="corrupcao">Art.173 Corrupção</option>
<option value="lavagem">Art.174 Lavagem de Dinheiro</option>
<option value="organizacao">Art.175 Organização Criminosa</option>
<option value="evasao">Art.177 Evasão</option>
<option value="extorsao_qualificada">Art.182 Extorsão</option>
</optgroup>

</select>

<button onclick="addCrime()">Adicionar Crime</button>

<div id="lista"></div>

<button onclick="finalizarBO()">Finalizar BO</button>
</div>

</div>

<!-- FICHA -->
<div class="tab">

<div class="card">
<h3>🪪 FICHA CRIMINAL</h3>

<input id="buscarId" placeholder="ID do suspeito">
<button onclick="buscarFicha()">Buscar</button>

<div id="ficha"></div>
</div>

</div>

</div>

<script>

const webhookURL = "https://discordapp.com/api/webhooks/1501244387185790986/6DLO24Eu_c-MZVNBJ7ZmcVX2RCw4SQA-3udA5UjV5gTp28jCH6YBO_SupKqVOKmqc9V0";

let crimes = [];
let db = JSON.parse(localStorage.getItem("db") || "{}");

/* LOGIN */
function login(){
localStorage.setItem("logado", user.value);
start();
}

function start(){
document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";
}

if(localStorage.getItem("logado")) start();

function logout(){
localStorage.clear();
location.reload();
}

/* TABS */
function tab(i){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));

document.querySelectorAll(".tab")[i].classList.add("active");
document.querySelectorAll(".tabs button")[i].classList.add("active");
}

/* CRIMES */
function addCrime(){
crimes.push(crime.value);
lista.innerHTML += `<div class="crime">${crime.value}</div>`;
}

/* FINALIZAR BO */
function finalizarBO(){

let id = document.getElementById("suspeitoId").value;
let nome = document.getElementById("suspeitoNome").value;

if(!db[id]){
db[id] = {nome:nome, ocorrencias:[]};
}

db[id].ocorrencias.push({
crimes: crimes,
bo: document.getElementById("bo").value,
oficial: document.getElementById("oficialNome").value,
oficialId: document.getElementById("oficialId").value
});

localStorage.setItem("db", JSON.stringify(db));

let texto = `
👮 OFICIAL: ${document.getElementById("oficialNome").value} (${document.getElementById("oficialId").value})
👤 SUSPEITO: ${nome} (${id})
⚖️ CRIMES: ${crimes.join(", ")}
📝 BO: ${document.getElementById("bo").value}
`;

fetch(webhookURL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"MDT PRO MAX",
embeds:[{
title:"📄 BO REGISTRADO",
description:"```"+texto+"```",
color:3447003
}]
})
});

alert("BO salvo!");
crimes=[];
lista.innerHTML="";
}

/* FICHA */
function buscarFicha(){

let id = buscarId.value;
let data = db[id];

if(!data){
ficha.innerHTML = "Sem registros";
return;
}

ficha.innerHTML = `
<h4>${data.nome}</h4>
<p>ID: ${id}</p>
<p>Ocorrências: ${data.ocorrencias.length}</p>
`;
}

</script>

</body>
</html>
