<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ATLAS MDT - LOGIN</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#020611;
    color:#00d4ff;
}

/* LOGIN */
#loginBox{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
}

.login-card{
    background:#0a0f18;
    padding:20px;
    border-radius:10px;
    width:300px;
}

input, select, textarea{
    width:100%;
    padding:10px;
    margin:5px 0;
    background:#050a14;
    border:1px solid #1a2a3a;
    color:white;
    border-radius:6px;
}

/* MAIN */
#app{
    display:none;
}

/* TOP BAR */
.topbar{
    background:#000;
    padding:10px;
    display:flex;
    justify-content:space-between;
}

/* ABAS */
.tabs{
    display:flex;
    background:#0a0f18;
}

.tabs button{
    flex:1;
    padding:10px;
    background:#050a14;
    color:#00d4ff;
    border:none;
    cursor:pointer;
}

.tabs button.active{
    background:#00d4ff;
    color:#000;
}

/* CONTEUDO */
.tab{
    display:none;
    padding:10px;
}

.tab.active{
    display:block;
}

.card{
    background:#0a0f18;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

button{
    padding:8px;
    background:#00d4ff;
    border:none;
    cursor:pointer;
    border-radius:6px;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<div class="login-card">
<h3>🔐 MDT LOGIN</h3>
<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>
<button onclick="register()">Cadastrar</button>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="topbar">
<span>ATLAS MDT SYSTEM</span>
<button onclick="logout()">Sair</button>
</div>

<div class="tabs">
<button class="active" onclick="openTab(0)">Código Penal</button>
<button onclick="openTab(1)">Consulta</button>
<button onclick="openTab(2)">BO</button>
</div>

<!-- ABA 1 -->
<div class="tab active">
<div class="card">
<h3>📚 Código Penal</h3>

<select id="crime">
<option value="homicidio">Homicídio</option>
<option value="roubo">Roubo</option>
<option value="fraude">Fraude Bancária</option>
<option value="invasao">Invasão à Rede Bancária</option>
</select>

<button onclick="addCrime()">Adicionar</button>
<div id="lista"></div>
</div>

<div class="card">
<p>Tempo: <span id="tempo">0</span> meses</p>
<p>Multa: $<span id="multa">0</span></p>
</div>
</div>

<!-- ABA 2 -->
<div class="tab">
<div class="card">
<h3>🔎 Consulta</h3>
<input placeholder="Placa / CPF / Nome">
<button>Buscar</button>
</div>
</div>

<!-- ABA 3 -->
<div class="tab">
<div class="card">
<h3>📄 BO</h3>
<textarea id="bo" rows="10"></textarea>
<button onclick="saveBO()">Salvar BO</button>
</div>
</div>

</div>

<script>

/* LOGIN SIMPLE */
function login(){
let u = user.value;
let p = pass.value;

if(localStorage.getItem(u) === p){
localStorage.setItem("logado",u);
start();
}else{
alert("Login inválido");
}
}

function register(){
localStorage.setItem(user.value, pass.value);
alert("Conta criada");
}

function logout(){
localStorage.removeItem("logado");
location.reload();
}

function start(){
loginBox.style.display="none";
app.style.display="block";
}

/* AUTO LOGIN */
if(localStorage.getItem("logado")){
start();
}

/* ABAS */
function openTab(i){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));

document.querySelectorAll(".tab")[i].classList.add("active");
document.querySelectorAll(".tabs button")[i].classList.add("active");
}

/* CRIMES */
const db = {
homicidio:{t:45,m:100000},
roubo:{t:30,m:80000},
fraude:{t:35,m:90000},
invasao:{t:50,m:120000}
};

let lista=[];

function addCrime(){
let c = crime.value;
lista.push(c);
render();
}

function render(){
listaDiv.innerHTML="";
let t=0,m=0;

lista.forEach(c=>{
t+=db[c].t;
m+=db[c].m;

listaDiv.innerHTML+=`<div>${c}</div>`;
});

tempo.innerText=t;
multa.innerText=m;
}

/* BO */
function saveBO(){
localStorage.setItem("bo", bo.value);
alert("BO salvo");
}

bo.value = localStorage.getItem("bo") || "";

</script>

</body>
</html>
