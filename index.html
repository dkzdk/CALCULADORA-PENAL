<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ATLAS MDT</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#020611;
    color:#00d4ff;
}

/* TERMINAL */
.terminal{
    background:#000;
    color:#00ff9c;
    padding:10px;
    height:120px;
    overflow:auto;
    font-family:monospace;
}

/* GRID */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:10px;
    padding:10px;
}

.card{
    background:#0a0f18;
    padding:12px;
    border-radius:10px;
}

/* INPUTS */
input{
    width:100%;
    padding:8px;
    margin:5px 0;
    background:#050a14;
    border:1px solid #1a2a3a;
    color:white;
    border-radius:6px;
}

/* SELECT MELHORADO */
select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid rgba(0,212,255,0.3);
    background:#050a14;
    color:#00d4ff;
    font-weight:600;
    cursor:pointer;
    outline:none;
    appearance:none;

    background-image: url("data:image/svg+xml;utf8,<svg fill='%2300d4ff' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:18px;
}

select:hover{
    box-shadow:0 0 10px #00d4ff;
}

/* BUTTON */
button{
    padding:8px 12px;
    background:#00d4ff;
    border:none;
    cursor:pointer;
    border-radius:6px;
    font-weight:bold;
}

/* LISTA CRIMES */
.crime-item{
    display:flex;
    justify-content:space-between;
    background:#000;
    padding:6px;
    margin-top:5px;
    border-radius:6px;
}

.crime-item button{
    background:red;
    color:white;
}

/* RESULTADO */
.resultado span{
    color:#00ffae;
    font-weight:bold;
}

/* TEXTAREA */
textarea{
    width:100%;
    height:180px;
    background:#000;
    color:#00ff9c;
    border:none;
    padding:10px;
}
</style>
</head>

<body>

<div class="terminal" id="terminal"></div>

<div class="container">

<!-- DADOS -->
<div class="card">
<h3>👤 Dados</h3>
<input id="suspeito" placeholder="Suspeito">
<input id="oficial" placeholder="Oficial">
</div>

<!-- CRIMES -->
<div class="card">
<h3>📚 Código Penal</h3>

<select id="crime">

<!-- VIDA -->
<option value="homicidio">Homicídio</option>
<option value="tentativa">Tentativa de Homicídio</option>
<option value="lesao">Lesão Corporal</option>

<!-- PATRIMÔNIO -->
<option value="furto">Furto</option>
<option value="roubo">Roubo</option>
<option value="extorsao">Extorsão</option>

<!-- TRÂNSITO -->
<option value="fuga">Fuga de Abordagem</option>
<option value="racha">Racha Ilegal</option>

<!-- AUTORIDADE -->
<option value="desacato">Desacato</option>
<option value="resistencia">Resistência</option>

<!-- ARMAS -->
<option value="porte">Porte de Arma</option>

<!-- DIGITAL -->
<option value="fraude">Fraude Bancária</option>
<option value="invasao_banco">Invasão à Rede Bancária</option>

</select>

<button onclick="addCrime()">Adicionar Crime</button>

<div id="lista"></div>
</div>

<!-- MODIFICADORES -->
<div class="card">
<h3>⚙️ Modificadores</h3>
<label><input type="checkbox" id="reincidencia"> Reincidência</label><br>
<label><input type="checkbox" id="cooperacao"> Cooperação</label>
</div>

<!-- RESULTADO -->
<div class="card resultado">
<h3>📊 Resultado</h3>
<p>Tempo: <span id="tempo">0</span> meses</p>
<p>Multa: $<span id="multa">0</span></p>
</div>

<!-- RELATÓRIO -->
<div class="card">
<h3>📄 Relatório</h3>
<button onclick="gerar()">Gerar</button>
<textarea id="relatorio"></textarea>
</div>

</div>

<audio id="som" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b8c6c.mp3"></audio>

<script>

/* BANCO DE DADOS */
const crimesDB = {

homicidio:{nome:"Art.121 Homicídio",tempo:45,multa:100000},
tentativa:{nome:"Art.122 Tentativa",tempo:25,multa:70000},
lesao:{nome:"Art.129 Lesão",tempo:20,multa:30000},

furto:{nome:"Art.155 Furto",tempo:20,multa:30000},
roubo:{nome:"Art.157 Roubo",tempo:35,multa:80000},
extorsao:{nome:"Art.158 Extorsão",tempo:40,multa:100000},

fuga:{nome:"Fuga de Abordagem",tempo:25,multa:60000},
racha:{nome:"Racha Ilegal",tempo:20,multa:50000},

desacato:{nome:"Desacato",tempo:10,multa:20000},
resistencia:{nome:"Resistência",tempo:20,multa:50000},

porte:{nome:"Porte de Arma",tempo:30,multa:80000},

fraude:{nome:"Fraude Bancária",tempo:35,multa:90000},
invasao_banco:{nome:"Invasão à Rede Bancária",tempo:50,multa:120000}

};

let lista = [];

/* TERMINAL */
function log(msg){
    terminal.innerHTML += msg+"<br>";
    terminal.scrollTop = terminal.scrollHeight;
}

/* ADD CRIME */
function addCrime(){
    const id = crime.value;
    lista.push(id);

    som.currentTime = 0;
    som.play().catch(()=>{});

    log("[ADD] "+crimesDB[id].nome);

    render();
}

/* RENDER LISTA */
function render(){
    listaDiv.innerHTML = "";

    lista.forEach((c,i)=>{
        listaDiv.innerHTML += `
        <div class="crime-item">
        ${crimesDB[c].nome}
        <button onclick="remover(${i})">X</button>
        </div>`;
    });

    calcular();
}

/* REMOVER */
function remover(i){
    lista.splice(i,1);
    log("[REMOVIDO]");
    render();
}

/* CALCULO */
function calcular(){
    let t=0,m=0;

    lista.forEach(c=>{
        t+=crimesDB[c].tempo;
        m+=crimesDB[c].multa;
    });

    if(reincidencia.checked){
        t*=1.5;
        m*=1.5;
    }

    if(cooperacao.checked){
        t*=0.7;
        m*=0.7;
    }

    tempo.innerText = Math.round(t);
    multa.innerText = Math.round(m);
}

/* AUTO UPDATE */
reincidencia.onchange = calcular;
cooperacao.onchange = calcular;

/* RELATÓRIO */
function gerar(){
    calcular();

    relatorio.value =
`RELATÓRIO ATLAS MDT

Suspeito: ${suspeito.value}
Oficial: ${oficial.value}

Crimes:
${lista.map(c=>"- "+crimesDB[c].nome).join("\n")}

Pena: ${tempo.innerText} meses
Multa: $${multa.innerText}`;
}

</script>

</body>
</html>
