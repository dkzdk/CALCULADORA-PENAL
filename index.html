<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ATLAS MDT</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#020611;
    color:#00d4ff;
}

/* TELAS */
.tela{
    display:none;
    height:100vh;
    justify-content:center;
    align-items:center;
}

.ativa{
    display:flex;
}

/* BOX */
.box{
    background:#0a0f18;
    padding:30px;
    border-radius:10px;
    text-align:center;
}

input{
    display:block;
    margin:10px auto;
    padding:10px;
    width:220px;
}

button{
    padding:10px;
    margin-top:5px;
    background:#00d4ff;
    border:none;
    cursor:pointer;
}

/* APP */
#app{
    display:none;
}

.terminal{
    background:#000;
    color:#00ff9c;
    padding:10px;
    height:100px;
    overflow:auto;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:10px;
}

.card{
    background:#0a0f18;
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- REGISTRO -->
<div id="registro" class="tela ativa">
<div class="box">
<h2>📝 Criar Conta</h2>
<input id="newUser" placeholder="Usuário">
<input id="newPass" type="password" placeholder="Senha">
<button onclick="registrar()">Registrar</button>
<p onclick="irLogin()" style="cursor:pointer;">Já tem conta? Fazer login</p>
</div>
</div>

<!-- LOGIN -->
<div id="login" class="tela">
<div class="box">
<h2>🔐 Login</h2>
<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">
<button onclick="logar()">Entrar</button>
<p onclick="irRegistro()" style="cursor:pointer;">Criar conta</p>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="terminal" id="terminal"></div>

<div class="container">

<div class="card">
<h3>👤 Dados</h3>
<input id="suspeito" placeholder="Suspeito">
<input id="oficial" placeholder="Oficial">
</div>

<div class="card">
<h3>📚 Código Penal</h3>
<select id="crime">
<option value="homicidio">Homicídio</option>
<option value="roubo">Roubo</option>
<option value="furto">Furto</option>
<option value="drogas">Tráfico</option>
</select>
<button onclick="addCrime()">Adicionar</button>
<div id="lista"></div>
</div>

<div class="card">
<h3>⚙️ Modificadores</h3>
<label><input type="checkbox" id="reincidencia"> Reincidência</label><br>
<label><input type="checkbox" id="cooperacao"> Cooperação</label>
</div>

<div class="card">
<h3>📊 Resultado</h3>
<p>Tempo: <span id="tempo">0</span></p>
<p>Multa: $<span id="multa">0</span></p>
</div>

<div class="card">
<h3>📄 Relatório</h3>
<button onclick="gerar()">Gerar</button>
<textarea id="relatorio"></textarea>
</div>

</div>

</div>

<audio id="som" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b8c6c.mp3"></audio>

<script>

/* TROCA DE TELA */
function irLogin(){
    registro.classList.remove("ativa");
    login.classList.add("ativa");
}

function irRegistro(){
    login.classList.remove("ativa");
    registro.classList.add("ativa");
}

/* REGISTRO */
function registrar(){
    const u = newUser.value;
    const p = newPass.value;

    if(!u || !p){
        alert("Preencha tudo");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];

    if(users.find(x=>x.user===u)){
        alert("Usuário já existe");
        return;
    }

    users.push({user:u, pass:p});
    localStorage.setItem("users", JSON.stringify(users));

    alert("Conta criada!");
    irLogin();
}

/* LOGIN */
function logar(){
    const u = user.value;
    const p = pass.value;

    let users = JSON.parse(localStorage.getItem("users")) || [];

    const found = users.find(x=>x.user===u && x.pass===p);

    if(found){
        login.style.display="none";
        registro.style.display="none";
        app.style.display="block";
        log("[ACESSO] Login autorizado: "+u);
    }else{
        alert("Login inválido");
    }
}

/* SISTEMA PENAL */
const crimesDB={
homicidio:{nome:"Homicídio",tempo:40,multa:100000},
roubo:{nome:"Roubo",tempo:30,multa:80000},
furto:{nome:"Furto",tempo:20,multa:40000},
drogas:{nome:"Tráfico",tempo:60,multa:200000}
};

let lista=[];

/* TERMINAL */
function log(msg){
    terminal.innerHTML+=msg+"<br>";
    terminal.scrollTop=terminal.scrollHeight;
}

/* CRIMES */
function addCrime(){
    const id=crime.value;
    lista.push(id);

    som.play().catch(()=>{});

    log("[ADD] "+crimesDB[id].nome);
    render();
}

function render(){
    listaDiv.innerHTML="";
    lista.forEach((c,i)=>{
        listaDiv.innerHTML+=`
        <div>
        ${crimesDB[c].nome}
        <button onclick="remover(${i})">X</button>
        </div>`;
    });
    calcular();
}

function remover(i){
    lista.splice(i,1);
    render();
}

/* CALCULO */
function calcular(){
    let t=0,m=0;

    lista.forEach(c=>{
        t+=crimesDB[c].tempo;
        m+=crimesDB[c].multa;
    });

    if(reincidencia.checked){t*=1.5;m*=1.5;}
    if(cooperacao.checked){t*=0.7;m*=0.7;}

    tempo.innerText=Math.round(t);
    multa.innerText=Math.round(m);
}

reincidencia.onchange=calcular;
cooperacao.onchange=calcular;

/* RELATORIO */
function gerar(){
    calcular();
    relatorio.value=
`RELATÓRIO ATLAS

Suspeito: ${suspeito.value}
Oficial: ${oficial.value}

Crimes:
${lista.map(c=>"- "+crimesDB[c].nome).join("\n")}

Pena: ${tempo.innerText}
Multa: $${multa.innerText}`;
}

</script>

</body>
</html>
