<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ATLAS MDT POLICIAL</title>

<style>
body{
margin:0;
font-family:Arial;
background:#020611;
color:#00d4ff;
}

#login{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#000;
}

.login-card{
background:#0a0f18;
padding:20px;
border-radius:10px;
width:320px;
}

input,select,textarea{
width:100%;
padding:10px;
margin:5px 0;
background:#050a14;
border:1px solid #1a2a3a;
color:#fff;
border-radius:6px;
}

button{
width:100%;
padding:8px;
background:#00d4ff;
border:none;
cursor:pointer;
border-radius:6px;
font-weight:bold;
margin-top:5px;
}

#app{display:none;}

.topbar{
background:#000;
padding:10px;
display:flex;
justify-content:space-between;
}

.tabs{
display:flex;
background:#0a0f18;
}

.tabs button{
flex:1;
padding:10px;
border:none;
background:#050a14;
color:#00d4ff;
cursor:pointer;
}

.tabs button.active{
background:#00d4ff;
color:#000;
}

.tab{
display:none;
padding:10px;
}

.tab.active{display:block;}

.card{
background:#0a0f18;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.crime{
display:flex;
justify-content:space-between;
padding:5px;
background:#000;
margin-top:5px;
border-radius:6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<div class="login-card">
<h3>🔐 ATLAS MDT POLICIAL</h3>

<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<select id="role">
<option value="pm">Policial Militar</option>
<option value="pc">Policial Civil</option>
<option value="juridico">Jurídico</option>
</select>

<button onclick="register()">Cadastrar</button>
<button onclick="login()">Entrar</button>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="topbar">
<span>ATLAS MDT POLICIAL</span>
<button onclick="logout()">Sair</button>
</div>

<div class="tabs">
<button class="active" onclick="tab(0)">Código Penal</button>
<button onclick="tab(1)">Consulta</button>
<button onclick="tab(2)">BO</button>
<button onclick="tab(3)">Admin</button>
</div>

<div class="tab active">
<div class="card">
<h3>📚 Código Penal</h3>

<select id="crime">
<option value="homicidio">Homicídio</option>
<option value="roubo">Roubo</option>
<option value="fraude">Fraude Bancária</option>
<option value="invasao">Invasão Bancária</option>
</select>

<button onclick="addCrime()">Adicionar</button>
<div id="list"></div>
</div>

<div class="card">
Tempo: <span id="tempo">0</span> meses<br>
Multa: $<span id="multa">0</span>
</div>
</div>

<div class="tab">
<div class="card">
<h3>🔎 Consulta</h3>
<input placeholder="Nome / CPF / Placa">
<button>Buscar</button>
</div>
</div>

<div class="tab">
<div class="card">
<h3>📄 BO</h3>
<textarea id="bo" rows="10"></textarea>
<button onclick="saveBO()">Salvar BO</button>
<button onclick="sendWebhook()">Enviar Discord</button>
</div>
</div>

<div class="tab">
<div class="card">
<h3>⚙️ Admin</h3>
<button onclick="clearAll()">Reset Sistema</button>
</div>
</div>

</div>

<script>

const webhookURL = "https://discordapp.com/api/webhooks/1501244387185790986/6DLO24Eu_c-MZVNBJ7ZmcVX2RCw4SQA-3udA5UjV5gTp28jCH6YBO_SupKqVOKmqc9V0";

function register(){
localStorage.setItem(user.value, JSON.stringify({
pass: pass.value,
role: role.value
}));
alert("Conta criada");
}

function login(){

let data = localStorage.getItem(user.value);

if(!data){
alert("Usuário não existe");
return;
}

data = JSON.parse(data);

if(data.pass !== pass.value){
alert("Senha incorreta");
return;
}

localStorage.setItem("logado", user.value);
start();
}

function start(){
document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";
}

if(localStorage.getItem("logado")) start();

function logout(){
localStorage.clear();
location.reload();
}

function tab(i){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));

document.querySelectorAll(".tab")[i].classList.add("active");
document.querySelectorAll(".tabs button")[i].classList.add("active");
}

const db = {
homicidio:{t:50,m:100000},
roubo:{t:35,m:80000},
fraude:{t:40,m:90000},
invasao:{t:60,m:120000}
};

let crimes=[];

function addCrime(){
crimes.push(crime.value);
render();
}

function render(){
list.innerHTML="";
let t=0,m=0;

crimes.forEach((c,i)=>{
t+=db[c].t;
m+=db[c].m;

list.innerHTML+=`<div class='crime'>${c}<button onclick='remove(${i})'>X</button></div>`;
});

tempo.innerText=t;
multa.innerText=m;
}

function remove(i){
crimes.splice(i,1);
render();
}

function saveBO(){
localStorage.setItem("bo",bo.value);
alert("BO salvo");
}

bo.value = localStorage.getItem("bo") || "";

function sendWebhook(){

const userLogado = localStorage.getItem("logado");

fetch(webhookURL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"ATLAS MDT POLICIAL",
embeds:[{
title:"📄 NOVO BO",
color:3447003,
fields:[
{name:"👮 Usuário",value:userLogado,inline:true},
{name:"📝 BO",value:bo.value || "vazio"}
]
}]
})
});

alert("Enviado!");
}

function clearAll(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
