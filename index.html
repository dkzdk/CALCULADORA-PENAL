<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ATLAS MDT</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#020611;
    color:#00d4ff;
}

.terminal{
    background:#000;
    color:#00ff9c;
    padding:10px;
    height:120px;
    overflow:auto;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:10px;
    padding:10px;
}

.card{
    background:#0a0f18;
    padding:10px;
    border-radius:10px;
}

input,select{
    width:100%;
    padding:8px;
    margin:5px 0;
}

button{
    padding:8px;
    background:#00d4ff;
    border:none;
    cursor:pointer;
}

.crime-item{
    display:flex;
    justify-content:space-between;
    background:#000;
    padding:6px;
    margin-top:5px;
}

.crime-item button{
    background:red;
    color:white;
}
</style>
</head>

<body>

<div class="terminal" id="terminal"></div>

<div class="container">

<div class="card">
<h3>👤 Dados</h3>
<input id="suspeito" placeholder="Suspeito">
<input id="oficial" placeholder="Oficial">
</div>

<div class="card">
<h3>📚 Código Penal</h3>

<select id="crime">

<!-- VIDA -->
<option value="homicidio">Homicídio</option>
<option value="tentativa">Tentativa de Homicídio</option>
<option value="lesao">Lesão Corporal</option>
<option value="culposo">Homicídio Culposo</option>
<option value="omissao">Omissão de Socorro</option>

<!-- PATRIMONIO -->
<option value="furto">Furto</option>
<option value="roubo">Roubo</option>
<option value="extorsao">Extorsão</option>
<option value="sequestro">Sequestro</option>
<option value="receptacao">Receptação</option>

<!-- TRANSITO -->
<option value="fuga">Fuga de Abordagem</option>
<option value="racha">Racha Ilegal</option>
<option value="dui">Direção Sob Influência</option>

<!-- AUTORIDADE -->
<option value="desacato">Desacato</option>
<option value="resistencia">Resistência</option>

<!-- ARMAS -->
<option value="porte">Porte Ilegal de Arma</option>
<option value="disparo">Disparo em Via Pública</option>

<!-- DIGITAL (ALTERADO) -->
<option value="fraude_banco">Fraude Bancária</option>
<option value="invasao_banco">Invasão à Rede Bancária</option>

</select>

<button onclick="addCrime()">Adicionar</button>

<div id="lista"></div>

</div>

<div class="card">
<h3>⚙️ Modificadores</h3>
<label><input type="checkbox" id="reincidencia"> Reincidência</label><br>
<label><input type="checkbox" id="cooperacao"> Cooperação</label>
</div>

<div class="card">
<h3>📊 Resultado</h3>
<p>Tempo: <span id="tempo">0</span></p>
<p>Multa: $<span id="multa">0</span></p>
</div>

<div class="card">
<h3>📄 Relatório</h3>
<button onclick="gerar()">Gerar</button>
<textarea id="relatorio"></textarea>
</div>

</div>

<audio id="som" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b8c6c.mp3"></audio>

<script>

const crimesDB = {

homicidio:{nome:"Art.121 Homicídio",tempo:45,multa:100000},
tentativa:{nome:"Art.122 Tentativa",tempo:25,multa:70000},
lesao:{nome:"Art.129 Lesão",tempo:20,multa:30000},
culposo:{nome:"Art.123 Culposo",tempo:25,multa:60000},
omissao:{nome:"Art.124 Omissão",tempo:15,multa:30000},

furto:{nome:"Art.155 Furto",tempo:20,multa:30000},
roubo:{nome:"Art.157 Roubo",tempo:35,multa:80000},
extorsao:{nome:"Art.158 Extorsão",tempo:40,multa:100000},
sequestro:{nome:"Art.159 Sequestro",tempo:60,multa:150000},
receptacao:{nome:"Art.161 Receptação",tempo:25,multa:60000},

fuga:{nome:"Fuga de Abordagem",tempo:25,multa:60000},
racha:{nome:"Racha Ilegal",tempo:20,multa:50000},
dui:{nome:"Direção Sob Influência",tempo:20,multa:40000},

desacato:{nome:"Art.164 Desacato",tempo:10,multa:20000},
resistencia:{nome:"Art.165 Resistência",tempo:20,multa:50000},

porte:{nome:"Art.167 Porte Ilegal",tempo:30,multa:80000},
disparo:{nome:"Art.168 Disparo",tempo:40,multa:100000},

/* DIGITAL ALTERADO */
fraude_banco:{nome:"Art.169 Fraude Bancária",tempo:35,multa:90000},
invasao_banco:{nome:"Art.170 Invasão à Rede Bancária",tempo:50,multa:120000}

};

let lista = [];

/* TERMINAL */
function log(msg){
    terminal.innerHTML += msg+"<br>";
    terminal.scrollTop = terminal.scrollHeight;
}

/* CRIMES */
function addCrime(){
    const id = crime.value;
    lista.push(id);

    som.play().catch(()=>{});

    log("[ADD] "+crimesDB[id].nome);
    render();
}

function render(){
    listaDiv.innerHTML = "";
    lista.forEach((c,i)=>{
        listaDiv.innerHTML += `
        <div class="crime-item">
        ${crimesDB[c].nome}
        <button onclick="remover(${i})">X</button>
        </div>`;
    });
    calcular();
}

function remover(i){
    lista.splice(i,1);
    log("[REMOVIDO]");
    render();
}

/* CALCULO */
function calcular(){
    let t=0,m=0;

    lista.forEach(c=>{
        t+=crimesDB[c].tempo;
        m+=crimesDB[c].multa;
    });

    if(reincidencia.checked){t*=1.5;m*=1.5;}
    if(cooperacao.checked){t*=0.7;m*=0.7;}

    tempo.innerText=Math.round(t);
    multa.innerText=Math.round(m);
}

reincidencia.onchange=calcular;
cooperacao.onchange=calcular;

/* RELATORIO */
function gerar(){
    calcular();

    relatorio.value=
`RELATÓRIO ATLAS

Suspeito: ${suspeito.value}
Oficial: ${oficial.value}

Crimes:
${lista.map(c=>"- "+crimesDB[c].nome).join("\n")}

Pena: ${tempo.innerText} meses
Multa: $${multa.innerText}`;
}

</script>

</body>
</html>
